# CI for the framework itself: LaTeX smoke compiles, skill/command lint,
# CLI typechecks, and (upstream only) placeholder integrity.
#
# The LaTeX smoke job compiles anonymous fixtures (tests/fixtures/latex/) with
# the same engines the application pipeline uses - pdfLaTeX for the one-page
# article CV layout, XeLaTeX for cover.cls - so CI never needs the owner's CV
# repository, symlinks or local paths. Compile success, exact page counts, lint
# correctness and an extractable PDF text layer are asserted everywhere.
#
# Deliberately NOT here: live smoke tests of the job-portal CLIs. They hit
# real portals (network-flaky, and the linkedin-search skill is personal-use
# only per its own ToS warning - CI-automated requests would violate that).
# CI runs typechecks and the checked-in fixture/mock test suites only; live
# portal testing stays a local, on-demand step.
#
# Security posture: this template ships pre-approved Claude Code permissions
# and CLI code that every fork user executes, so the security-guards job
# fails PRs that widen settings.json permissions, weaken the personal-data
# gitignore rules, or add package lifecycle scripts; dependency-review flags
# newly introduced vulnerable/malicious dependencies. Honest limit: a PR can
# edit this workflow itself, so these guards catch accidents and casual
# attempts, not a determined author - branch protection with required checks
# and human review of workflow/settings diffs remain the real backstop.
# Actions are pinned to commit SHAs; the token is read-only.

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint skills, commands, settings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tools/lint_skills.py
      - name: Framework version guard (upstream template only)
        if: github.repository == 'MadsLorentzen/ai-job-search'
        run: python tools/check_framework_version.py

  security-guards:
    name: Security guards (permissions, gitignore, manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/security_guards.py

  python-tests:
    name: Python tool tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v

  dependency-review:
    name: Dependency review
    # Requires the repo's Dependency graph, which not every repo (upstream or
    # fork) has enabled - so the graph is probed first, and the job warns and
    # passes instead of hard-failing if it's unavailable (the same
    # graceful-skip pattern the workflow uses for optional tools), rather than
    # being gated to a specific repository. Enabling Dependency graph under
    # Settings -> Advanced Security activates the real check on any repo.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Probe Dependency graph availability
        id: graph
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dependency graph is not enabled on this repository (HTTP $code). Dependency review was skipped - enable Dependency graph under Settings -> Advanced Security to activate this check."
          fi
      - name: Dependency review
        if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  latex-smoke:
    name: Compile anonymous CV and cover-letter fixtures
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install PDF inspection tools
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftotext >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends poppler-utils
          fi
      - name: Compile CV fixture (pdflatex)
        run: |
          mkdir -p build/ci
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=build/ci \
            tests/fixtures/latex/cv_fixture.tex
          if grep -q '^!' build/ci/cv_fixture.log; then
            echo '::error::pdflatex reported errors compiling the CV fixture'
            grep -A3 '^!' build/ci/cv_fixture.log
            exit 1
          fi
      - name: Compile cover-letter fixture (xelatex, from cover_letters/)
        run: |
          cd cover_letters
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=../build/ci \
            ../tests/fixtures/latex/cover_fixture.tex
          if grep -q '^!' ../build/ci/cover_fixture.log; then
            echo '::error::xelatex reported errors compiling the cover-letter fixture'
            grep -A3 '^!' ../build/ci/cover_fixture.log
            exit 1
          fi
      - name: Verify page counts and extractable PDF text
        run: |
          python3 tools/verify_pdf.py build/ci/cv_fixture.pdf --pages 1 --min-chars 100 \
            --contains 'jane.placeholder@example.com'
          python3 tools/verify_pdf.py build/ci/cover_fixture.pdf --pages 1 --min-chars 100

  discover-clis:
    # The matrix is discovered, not hardcoded, so a portal CLI added in a fork
    # (the /add-portal path) gets typechecked and tested without the fork
    # having to edit this workflow - the same reason security-guards globs
    # .agents/**/package.json instead of naming the shipped portals.
    name: Discover portal CLIs
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.list.outputs.tools }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: list
        run: |
          tools=$(find .agents/skills -mindepth 3 -maxdepth 3 -path '*/cli/package.json' \
            | cut -d/ -f3 | sort | jq -R . | jq -cs .)
          echo "Discovered portal CLIs: $tools"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

  cli-checks:
    name: CLI checks ${{ matrix.tool }}
    needs: discover-clis
    if: needs.discover-clis.outputs.tools != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.discover-clis.outputs.tools) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - run: bun run typecheck
        working-directory: .agents/skills/${{ matrix.tool }}/cli
      - name: Run fixture/mock tests when present
        run: |
          if find tests -type f -name '*.test.ts' | grep -q .; then
            bun test
          else
            echo "No Bun tests found for ${{ matrix.tool }}; skipping"
          fi
        working-directory: .agents/skills/${{ matrix.tool }}/cli

  placeholder-integrity:
    # Runs on every repository, unlike upstream, where this job is gated to the
    # template repo because forks personalize the tracked files in place. This
    # fork is PUBLIC and inverts that: the files /setup personalizes are
    # gitignored, only their `*.example` twins are tracked, and this job is the
    # check that keeps the split honest. Two failure modes, both caught below:
    # a template that lost its placeholders, and a personal file that got staged.
    name: Placeholder integrity and personal-data leak guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Tracked template files must keep their placeholder tokens
        run: |
          fail=0
          check() {
            if [ ! -f "$1" ]; then
              echo "::error file=$1::tracked template file is missing"
              fail=1
            elif ! grep -q "$2" "$1"; then
              echo "::error file=$1::expected placeholder token $2 - personal data may have been committed"
              fail=1
            fi
          }
          check CLAUDE.example.md '\[YOUR_NAME\]'
          check tests/fixtures/latex/cv_fixture.tex 'JOBFLOW-ANONYMOUS-FIXTURE'
          check tests/fixtures/latex/cover_fixture.tex 'JOBFLOW-ANONYMOUS-FIXTURE'
          check .claude/skills/job-application-assistant/01-candidate-profile.example.md '<!-- SETUP'
          check .claude/skills/job-application-assistant/04-job-evaluation.example.md '\[YOUR_PRIMARY_SKILLS\]'
          check job_scraper/companies.example.json '\[YOUR_TARGET_COMPANY\]'
          exit $fail
      - name: Personalized files must not be tracked
        run: |
          fail=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error file=$path::personal file is tracked - it must stay gitignored, only its *.example twin belongs in git"
              fail=1
            fi
          done <<'PATHS'
          CLAUDE.md
          .claude/skills/job-application-assistant/01-candidate-profile.md
          .claude/skills/job-application-assistant/02-behavioral-profile.md
          .claude/skills/job-application-assistant/04-job-evaluation.md
          .claude/skills/job-application-assistant/05-cv-templates.md
          .claude/skills/job-application-assistant/07-interview-prep.md
          .claude/skills/job-scraper/search-queries.md
          job_scraper/scrape_config.json
          job_scraper/companies.json
          job_scraper/jobs.md
          job_scraper/activity.jsonl
          job_scraper/runs.json
          job_scraper/collection_state.json
          job_scraper/linkedin_inbox.json
          job_scraper/linkedin_intake_state.json
          cv/my_cv.tex
          PATHS
          tracked_private=$(git ls-files -- docs cv/variants cv/out job_scraper/run_state job_scraper/linkedin_emails documents/runs tmp)
          if [ -n "$tracked_private" ]; then
            echo "::error::these must stay untracked - working notes, personal CV drivers, per-run supervisor state and transcripts, and tmp/ scratch files:"
            echo "$tracked_private"
            fail=1
          fi
          exit $fail
